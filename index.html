<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Портал заявок</title>
<meta name="description" content="Корпоративный портал заявок ТОО «Ойл энд газ» — рабочий прототип по PRD v1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0B2545;--secondary:#3E5C76;--accent:#E09F3E;--bg:#F4F6F8;--text:#1B1F24;
  --muted:#5B6673;--border:#DCE2E8;--card:#FFFFFF;--hover:#EEF2F6;
  --ok:#2E7D32;--warn:#ED6C02;--err:#C62828;--info:#0277BD;
  --ok-bg:#E8F3E9;--warn-bg:#FDF0E5;--err-bg:#FBEAEA;--info-bg:#E5F2FA;--muted-bg:#EDF0F3;--primary-bg:#E6EBF2;
  --radius:8px;--shadow:0 1px 2px rgba(11,37,69,.06),0 1px 3px rgba(11,37,69,.08);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 Inter,Roboto,"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--info);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3{margin:0 0 12px;line-height:1.25}
h1{font-size:22px}h2{font-size:17px}h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* layout */
.layout{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{background:var(--primary);color:#D8E1EC;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo{width:34px;height:34px;border-radius:7px;background:var(--accent);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.brand b{display:block;color:#fff;font-size:14px}
.brand small{color:#9FB0C4;font-size:12px}
.nav{padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:6px;color:#C9D4E1;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.07);text-decoration:none;color:#fff}
.nav a.active{background:rgba(224,159,62,.16);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav .cnt{background:var(--accent);color:var(--primary);border-radius:10px;font-size:11px;font-weight:700;padding:0 7px;line-height:18px}
.nav-sec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#7F93AA;padding:14px 12px 4px}
.side-foot{margin-top:auto;padding:14px 18px;font-size:12px;color:#7F93AA;border-top:1px solid rgba(255,255,255,.08)}
.side-foot button{background:none;border:0;color:#C9D4E1;cursor:pointer;padding:0;text-decoration:underline}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{height:58px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:20}
.burger{display:none;background:none;border:0;font-size:22px;cursor:pointer;padding:4px 6px}
.search{flex:1;max-width:340px;position:relative}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--border);border-radius:6px;background:var(--bg)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5}
.top-r{margin-left:auto;display:flex;align-items:center;gap:6px;position:relative}
.icon-btn{background:none;border:0;cursor:pointer;width:38px;height:38px;border-radius:6px;display:grid;place-items:center;position:relative}
.icon-btn:hover{background:var(--hover)}
.dot{position:absolute;top:4px;right:3px;background:var(--err);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.user-btn{display:flex;align-items:center;gap:8px;background:none;border:0;cursor:pointer;padding:4px 8px;border-radius:6px}
.user-btn:hover{background:var(--hover)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--secondary);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.user-btn .nm{text-align:left;line-height:1.2}
.user-btn .nm small{color:var(--muted);font-size:12px}
.dropdown{position:absolute;right:0;top:48px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 24px rgba(11,37,69,.15);width:340px;max-height:70vh;overflow:auto;z-index:30}
.dropdown .dd-h{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:600}
.dd-item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--border);padding:10px 14px;cursor:pointer;color:var(--text)}
.dd-item:hover{background:var(--hover);text-decoration:none}
.dd-item.unread{background:#FFF8EC}
.dd-item small{display:block;color:var(--muted);font-size:12px}
.content{padding:24px;max-width:1280px;width:100%}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-h h1{margin:0}
.crumbs{color:var(--muted);font-size:13px;margin-bottom:4px}

/* components */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card+.card{margin-top:16px}
.card-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.card-h h2,.card-h h3{margin:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:6px;border:1px solid var(--border);background:var(--card);cursor:pointer;font-weight:500;white-space:nowrap;color:var(--text)}
.btn:hover{background:var(--hover);text-decoration:none}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn-primary:hover{background:#163864}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#1B1F24;font-weight:600}
.btn-accent:hover{background:#D08E2C}
.btn-danger{background:var(--err);border-color:var(--err);color:#fff}
.btn-danger:hover{background:#A82121}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-ok:hover{background:#256A29}
.btn-sm{padding:4px 10px;font-size:13px}
.btn-block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-warn{background:var(--warn-bg);color:#B04F00}
.b-err{background:var(--err-bg);color:var(--err)}.b-info{background:var(--info-bg);color:var(--info)}
.b-muted{background:var(--muted-bg);color:var(--muted)}.b-primary{background:var(--primary-bg);color:var(--primary)}
.chip{display:inline-block;padding:1px 8px;border-radius:4px;background:var(--muted-bg);font-size:12px;margin:1px 2px 1px 0}
.muted{color:var(--muted)}
.small{font-size:12px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.alert{padding:10px 14px;border-radius:6px;margin-bottom:12px;border-left:4px solid}
.a-warn{background:var(--warn-bg);border-color:var(--warn)}
.a-err{background:var(--err-bg);border-color:var(--err)}
.a-info{background:var(--info-bg);border-color:var(--info)}
.a-ok{background:var(--ok-bg);border-color:var(--ok)}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px}
table.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl .mono{white-space:nowrap}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--hover)}
.tbl tr.overdue td:first-child{box-shadow:inset 3px 0 0 var(--err)}
.tbl tr.overdue td{background:#FFF6F6}
.tbl input[type=number]{width:72px;padding:4px 6px;border:1px solid var(--border);border-radius:4px}

/* forms */
.field{margin-bottom:14px}
.field>label,.lbl{display:block;font-weight:500;margin-bottom:5px}
.req{color:var(--err)}
.inp,.field input:not([type=checkbox]):not([type=radio]),.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid #C7D0DA;border-radius:6px;background:#fff}
.field textarea{min-height:88px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--secondary);outline:2px solid rgba(62,92,118,.2)}
.field.has-err input,.field.has-err select,.field.has-err textarea{border-color:var(--err)}
.ferr{color:var(--err);font-size:12px;margin-top:4px}
.hint{color:var(--muted);font-size:12px;margin-top:4px}
.range{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.check{display:flex;gap:8px;align-items:center;cursor:pointer}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
.filters .field{margin:0;min-width:150px}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto}
.tabs a{padding:9px 14px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--text);text-decoration:none}
.tabs a.active{color:var(--primary);border-color:var(--accent)}
.tabs .badge{margin-left:4px}

/* kpi */
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .v{font-size:26px;font-weight:700;color:var(--primary);line-height:1.2}
.kpi .l{color:var(--muted);font-size:13px}
a.kpi:hover{text-decoration:none;border-color:var(--secondary)}

/* stepper */
.stepper{display:flex;margin:4px 0 6px}
.step{flex:1;text-align:center;position:relative;font-size:12px;color:var(--muted)}
.step::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--border);z-index:0}
.step:first-child::before{display:none}
.step .c{width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid var(--border);display:grid;place-items:center;margin:0 auto 4px;position:relative;z-index:1;font-size:11px;font-weight:700}
.step.done .c{background:var(--ok);border-color:var(--ok);color:#fff}
.step.done::before,.step.cur::before{background:var(--ok)}
.step.cur .c{border-color:var(--accent);background:var(--accent);color:var(--primary)}
.step.cur{color:var(--text);font-weight:600}
.step.warn .c{border-color:var(--warn);background:var(--warn);color:#fff}

/* request card */
.kv{display:grid;grid-template-columns:200px 1fr;gap:6px 14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;white-space:pre-wrap;word-break:break-word}
.side-kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px}
.side-kv dt{color:var(--muted)}.side-kv dd{margin:0}
.comment{padding:10px 12px;border-radius:6px;background:var(--bg);margin-bottom:8px}
.comment.internal{background:#FFF8EC;border:1px dashed var(--accent)}
.comment.sys{background:var(--info-bg)}
.comment .h{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-bottom:3px}
.comment .t{white-space:pre-wrap;word-break:break-word}
.timeline{list-style:none;margin:0;padding:0;font-size:13px}
.timeline li{padding:0 0 10px 16px;border-left:2px solid var(--border);position:relative}
.timeline li::before{content:"";position:absolute;left:-5px;top:5px;width:8px;height:8px;border-radius:50%;background:var(--secondary)}
.timeline small{color:var(--muted);display:block}
.file{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--border);border-radius:6px;margin:0 6px 6px 0;font-size:13px;background:#fff}

/* catalog */
.cat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.cat-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cat-ic{width:34px;height:34px;border-radius:7px;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.type-item{display:flex;align-items:center;gap:6px;border-radius:6px}
.type-item a{flex:1;padding:8px 10px;color:var(--text);border-radius:6px}
.type-item a:hover{background:var(--hover);text-decoration:none}
.star{background:none;border:0;cursor:pointer;font-size:16px;color:#B8C2CC;padding:4px 8px}
.star.on{color:var(--accent)}

/* charts */
.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:170px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.bar-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-t{height:14px;background:var(--muted-bg);border-radius:3px;overflow:hidden}
.bar-f{height:100%;background:var(--secondary);border-radius:3px}
.bar-v{text-align:right;font-weight:600}
.cols{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:10px;border-bottom:1px solid var(--border)}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--muted)}
.col .f{width:100%;max-width:28px;background:var(--secondary);border-radius:3px 3px 0 0;min-height:2px}
.col .f.today{background:var(--accent)}
.col-lbls{display:flex;gap:4px;font-size:10px;color:var(--muted)}
.col-lbls span{flex:1;text-align:center}

/* calendar */
.cal{border-collapse:collapse;font-size:12px}
.cal th,.cal td{border:1px solid var(--border);padding:0;text-align:center;min-width:24px;height:28px}
.cal th{background:var(--bg);font-weight:600;font-size:11px}
.cal th.we,.cal td.we{background:#EEF1F4}
.cal th.hot{background:var(--err-bg);color:var(--err)}
.cal td.name{text-align:left;padding:0 10px;white-space:nowrap;min-width:180px;font-size:13px;position:sticky;left:0;background:#fff}
.cal td.v{background:var(--secondary)}
.cal td.vp{background:repeating-linear-gradient(45deg,#9FB3C6,#9FB3C6 4px,#C9D6E2 4px,#C9D6E2 8px)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-3px;margin-right:5px}

/* modal / toast */
.modal-bg{position:fixed;inset:0;background:rgba(11,37,69,.45);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:#fff;border-radius:10px;width:100%;max-width:500px;padding:22px;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.merr{color:var(--err);font-size:13px;min-height:1px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--primary);color:#fff;padding:10px 18px;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.2);animation:tin .2s ease-out}
.toast.err{background:var(--err)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.stars{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:4px}
.stars input{position:absolute;opacity:0;width:1px;height:1px}
.stars label{font-size:30px;color:#C7D0DA;cursor:pointer;line-height:1}
.stars input:checked~label,.stars label:hover,.stars label:hover~label{color:var(--accent)}
.stars input:focus-visible+label{outline:2px solid var(--accent)}

/* login */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.login-hero{background:var(--primary);color:#D8E1EC;padding:48px;display:flex;flex-direction:column;justify-content:space-between}
.login-hero h2{color:#fff;font-size:28px;max-width:440px;line-height:1.25;margin:0 0 14px}
.login-hero ul{padding-left:18px;margin:0;color:#B9C6D6}
.login-hero li{margin-bottom:6px}
.login-side{display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:380px}
.demo{margin-top:22px;border-top:1px solid var(--border);padding-top:16px}
.demo-list{display:grid;gap:6px;margin-top:8px}
.demo-list button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:#fff;border:1px solid var(--border);border-radius:6px;padding:7px 10px;cursor:pointer}
.demo-list button:hover{background:var(--hover)}

.org ul{list-style:none;padding-left:22px;margin:0;border-left:1px dashed var(--border)}
.org>ul{padding-left:0;border:0}
.org li{padding:6px 0}
.builder-row{display:grid;grid-template-columns:1.4fr 1fr 1.2fr auto auto;gap:8px;align-items:center;margin-bottom:8px}
.builder-row input,.builder-row select{padding:7px 9px;border:1px solid #C7D0DA;border-radius:6px;width:100%}

@media (max-width:1100px){.split{grid-template-columns:1fr}.cat-grid{grid-template-columns:1fr 1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;width:260px;z-index:50;transform:translateX(-100%);transition:transform .2s}
  .sidebar.open{transform:none;box-shadow:0 0 0 100vmax rgba(11,37,69,.4)}
  .burger{display:block}
  .topbar{padding:0 12px}
  .content{padding:16px}
  .user-btn .nm{display:none}
  .g2,.g3{grid-template-columns:1fr}
  .login-wrap{grid-template-columns:1fr}
  .login-hero{display:none}
}
@media (max-width:640px){
  .cat-grid{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr;gap:0 0}
  .kv dd{margin-bottom:8px}
  .bar-row{grid-template-columns:110px 1fr 36px}
  .dropdown{position:fixed;left:8px;right:8px;width:auto;top:58px}
  .search{max-width:none}
  .builder-row{grid-template-columns:1fr 1fr}
  .stepper .step span{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" aria-live="polite"></div>
<noscript>Для работы портала необходимо включить JavaScript.</noscript>

<script>
'use strict';
/* ================== Константы ================== */
const KEY = 'oilgas-portal-v1';
const HOUR = 36e5, DAY = 864e5;
const DEMO_PASSWORD = 'Portal2026';
const IDLE_MIN = 30;
const STATUS = {
  draft:['Черновик','muted'], pending_approval:['На согласовании','info'], returned:['На доработке','warn'],
  rejected:['Отклонено','err'], new:['Новая','primary'], in_progress:['В работе','info'],
  waiting_info:['Ожидает информации','warn'], done:['Выполнено','ok'], closed:['Закрыто','muted'], cancelled:['Отозвано','muted']
};
const ACTIVE = ['new','in_progress','waiting_info'];
const ROLE_NAMES = {employee:'Сотрудник', head:'Руководитель', manager:'Менеджер', admin:'Администратор'};
const PRIOS = ['Низкий','Средний','Высокий','Критический'];
const PRIO_BADGE = {'Низкий':'muted','Средний':'info','Высокий':'warn','Критический':'err'};
const CAT_COLORS = {HR:'#3E5C76', IT:'#0277BD', AHO:'#8A5A12'};
const HOLIDAYS = ['2026-01-01','2026-01-02','2026-01-07','2026-03-08','2026-03-09','2026-03-21','2026-03-22','2026-03-23','2026-03-24','2026-05-01','2026-05-07','2026-05-09','2026-05-27','2026-07-06','2026-08-30','2026-08-31','2026-10-25','2026-10-26','2026-12-16',

  const rem = r.slaDue-now(), total = r.slaDue-r.newAt;
  if(rem<0) return `<span class="badge b-err">Просрочено на ${hrs(rem)}</span>`;
  if(rem < total*0.2) return `<span class="badge b-warn">Осталось ${hrs(rem)}</span>`;
  return `<span class="small">до ${fmtDT(r.slaDue)}</span>`;
}
function periodOf(r){ const f=r.form; return f.period || f.newPeriod || null; }
function vacOverlap(r){
  const author = U(r.authorId), p = periodOf(r); if(!p) return null;
  const team = DB.users.filter(u=>u.active && u.dept===author.dept);
  const others = DB.requests.filter(x=>x.id!==r.id && T(x.typeId).vacation && !['draft','rejected','cancelled'].includes(x.status) && x.authorId!==r.authorId && U(x.authorId).dept===author.dept)
    .filter(x=>{ const q=periodOf(x); return q && q.from<=p.to && q.to>=p.from; });
  const names = [...new Set(others.map(x=>x.authorId))];
  return {names:names.map(id=>shortName(U(id))), ratio:(names.length+1)/team.length, team:team.length};
}

/* ================== Журнал, уведомления, история ================== */
function audit(action, entity, entityId, payload, userId){ DB.audit.unshift({id:uid(),t:now(),userId:userId!==undefined?userId:(me()?.id||null),action,entity,entityId,payload:payload||'',ip:'10.0.1.'+(20+Math.floor(Math.random()*60))}); if(DB.audit.length>2000) DB.audit.length=2000; }
function notify(userId, r, text){ if(!userId || (me() && userId===me().id)) return; DB.notifications.unshift({id:uid(),userId,reqId:r?r.id:null,text,read:false,t:now()}); }
function hist(r, action, userId){ r.history.push({t:now(),userId:userId!==undefined?userId:me().id,action}); r.updatedAt=now(); }
function setStatus(r, status, action, comment){
  const old = r.status; r.status = status; hist(r, action);
  if(comment) r.comments.push({id:uid(),t:now(),userId:me().id,text:comment,internal:false});
  audit('Смена статуса заявки','Request',r.number,`${STATUS[old][0]} → ${STATUS[status][0]}`);
}
function toQueue(r){
  const t=T(r.typeId); r.status='new'; r.newAt=now(); r.slaDue=now()+t.sla*HOUR; r.slaWarned=false; r.slaNotified=false;
  managersOf(t.cat).forEach(m=>notify(m.id, r, `Новая заявка в очереди: ${r.number}`));
}
function submitRequest(r){
  const t=T(r.typeId), author=U(r.authorId);
  const ap = t.approval ? resolveApprover(author) : null;
  if(ap){ r.status='pending_approval'; r.approverId=ap; r.approvalDue=now()+(t.slaApproval||8)*HOUR; notify(ap, r, `Требуется согласование: ${r.number} (${shortName(author)})`); hist(r,'Отправлена на согласование'); }
  else { toQueue(r); hist(r, t.approval?'Согласование пропущено (нет руководителя) — передана в очередь':'Передана в очередь исполнителей'); }
}
function autoProcess(){
  let changed=false;
  DB.requests.forEach(r=>{
    if(r.status==='done' && r.doneAt && workdaysSince(r.doneAt)>=3){ r.status='closed'; r.closedAt=now(); r.history.push({t:now(),userId:null,action:'Закрыта автоматически (3 рабочих дня без ответа заявителя)'}); changed=true; }
    if(ACTIVE.includes(r.status) && r.slaDue){
      const rem=r.slaDue-now(), total=r.slaDue-r.newAt;
      if(rem<0 && !r.slaNotified){ r.slaNotified=true; changed=true;
        const tgt=new Set([r.assigneeId, ...managersOf(catOf(r)).filter(m=>m.senior).map(m=>m.id)]);
        tgt.forEach(id=>id&&DB.notifications.unshift({id:uid(),userId:id,reqId:r.id,text:`Нарушен SLA по заявке ${r.number}`,read:false,t:now()})); }
      else if(rem>=0 && rem<total*0.2 && !r.slaWarned){ r.slaWarned=true; changed=true; if(r.assigneeId) DB.notifications.unshift({id:uid(),userId:r.assigneeId,reqId:r.id,text:`Скоро истекает SLA: ${r.number}`,read:false,t:now()}); }
    }
  });
  if(changed) save();
}

      case 'period': { const p=periodOf(r); return `<td class="small">${p?fmtD(p.from)+' – '+fmtD(p.to):'—'}</td>`; }

  };
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${cols.map(c=>`<th>${c==='sel'?`<input type="checkbox" aria-label="Выбрать все" onchange="A.selAll(this.checked,[${list.map(r=>`'${r.id}'`).join(',')}])">`:H[c]}</th>`).join('')}</tr></thead>

function stepper(r){

  const idx = {draft:0,pending_approval:1,returned:1,new:needAp?2:1,in_progress:needAp?3:2,waiting_info:needAp?3:2,done:needAp?4:3,closed:steps.length}[r.status];
  if(idx===undefined) return '';
  return `<div class="stepper">${steps.map((s,i)=>`<div class="step ${i<idx?'done':i===idx?(r.status==='returned'||r.status==='waiting_info'?'warn cur':'cur'):''}"><div class="c">${i<idx?'✓':i+1}</div><span>${s}</span></div>`).join('')}</div>`;
}
function fmtVal(f,v){

    case 'employee': return esc(U(v)?.name||'—');
    case 'file': return v.map(x=>`<span class="file">📎 ${esc(x.name)}</span>`).join('');
    default: return esc(v);
  }
}

function pCalendar(){

  const base = new Date(); base.setDate(1); base.setMonth(base.getMonth()+UI.calMonth);

  const days=[...Array(nd)].map((_,i)=>{ const d=new Date(y,m,i+1); return {iso:isoDate(d), n:i+1, we:[0,6].includes(d.getDay())||HOLIDAYS.includes(isoDate(d))}; });

  const state = (uid_,iso) => { let st=''; vac.filter(r=>r.authorId===uid_).forEach(r=>{ const p=periodOf(r); if(p&&p.from<=iso&&p.to>=iso) st = ['pending_approval','returned'].includes(r.status)&&st!=='v' ? 'vp' : 'v'; }); return st; };

    <button class="btn" onclick="UI.calMonth--;render()" aria-label="Предыдущий месяц">‹</button><b style="min-width:130px;text-align:center">${base.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</b><button class="btn" onclick="UI.calMonth++;render()" aria-label="Следующий месяц">›</button></div></div>
  ${hot.some(Boolean)?'<div class="alert a-err">В отмеченные красным дни в отпуске более 30% сотрудников подразделения.</div>':''}
  <div class="card"><div class="tbl-wrap"><table class="cal"><thead><tr><th style="text-align:left;padding:0 10px">Сотрудник</th>${days.map((d,i)=>`<th class="${d.we?'we':''} ${hot[i]?'hot':''}">${d.n}</th>`).join('')}</tr></thead>

  <div class="legend"><span><i style="background:var(--secondary)"></i>Отпуск согласован</span><span><i style="background:repeating-linear-gradient(45deg,#9FB3C6,#9FB3C6 4px,#C9D6E2 4px,#C9D6E2 8px)"></i>На согласовании</span><span><i style="background:#EEF1F4;border:1px solid var(--border)"></i>Выходной / праздник</span><span><i style="background:var(--err-bg)"></i>Пересечение &gt; 30%</span></div></div>`;
}

  const all = reportScope(u).filter(r=>!period||r.createdAt>now()-period*DAY);
  const approved = all.filter(r=>r.approvedAt), finished = all.filter(r=>r.doneAt&&r.newAt), withSla = all.filter(r=>r.slaDue&&(['done','closed'].includes(r.status)||isOverdue(r)));
  const breached = withSla.filter(r=>['done','closed'].includes(r.status)?(r.doneAt>r.slaDue):true);
  const rated = all.filter(r=>r.rating);
  const avg = (arr,fn) => arr.length?arr.reduce((s,x)=>s+fn(x),0)/arr.length:0;
  const execs = [...new Set(all.map(r=>r.assigneeId).filter(Boolean))].map(id=>{ const rs=all.filter(r=>r.assigneeId===id); const fin=rs.filter(r=>r.doneAt); const rt=rs.filter(r=>r.rating); return {u:U(id),n:rs.length,fin:fin.length,avg:avg(fin,r=>r.doneAt-r.newAt),rating:rt.length?avg(rt,r=>r.rating):null,over:rs.filter(r=>isOverdue(r)||(r.doneAt&&r.slaDue&&r.doneAt>r.slaDue)).length}; });
  const days=[...Array(14)].map((_,i)=>{ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-13+i); return d; });
  const perDay = days.map(d=>reportScope(u).filter(r=>r.createdAt>=d.getTime()&&r.createdAt<d.getTime()+DAY).length);
  const maxD = Math.max(1,...perDay);
  const scopeTxt = has(u,'admin')?'вся компания':[has(u,'head')?'ваше подразделение':'',has(u,'manager')?'категории: '+u.mgrCats.map(c=>C(c).name).join(', '):''].filter(Boolean).join(' + ');
  return `<div class="page-h"><div><h1>Отчёты</h1><div class="small muted">Область: ${esc(scopeTxt)}</div></div>
    <div class="row"><select class="inp" style="width:auto" onchange="UI.reportPeriod=this.value;render()" aria-label="Период">${[['7','7 дней'],['30','30 дней'],['90','90 дней'],['0','Всё время']].map(([v,l])=>`<option value="${v}" ${UI.reportPeriod===v?'selected':''}>${l}</option>`).join('')}</select>
    <button class="btn" onclick="A.exportList('report')">Выгрузить в Excel (CSV)</button><button class="btn" onclick="window.print()">PDF / Печать</button></div></div>
  <div class="grid g4" style="margin-bottom:16px">
    <div class="kpi"><div class="v">${all.length}</div><div class="l">Заявок за период</div></div>
    <div class="kpi"><div class="v">${approved.length?hrs(avg(approved,r=>r.approvedAt-r.createdAt)):'—'}</div><div class="l">Среднее время согласования</div></div>
    <div class="kpi"><div class="v">${finished.length?hrs(avg(finished,r=>r.doneAt-r.newAt)):'—'}</div><div class="l">Среднее время исполнения</div></div>
    <div class="kpi"><div class="v" style="color:${breached.length?'var(--err)':'var(--ok)'}">${withSla.length?Math.round(breached.length/withSla.length*100)+'%':'—'}</div><div class="l">Доля нарушений SLA</div></div>
  </div>
  <div class="grid g2">
    <div class="card" style="margin:0"><h3>По категориям</h3>${bars(DB.categories.map(c=>[c.name,all.filter(r=>catOf(r)===c.id).length,CAT_COLORS[c.id]]))}</div>
    <div class="card" style="margin:0"><h3>По статусам</h3>${bars(Object.keys(STATUS).filter(s=>s!=='draft').map(s=>[STATUS[s][0],all.filter(r=>r.status===s).length,`var(--${STATUS[s][1]==='muted'?'secondary':STATUS[s][1]==='primary'?'primary':STATUS[s][1]})`]).filter(x=>x[1]))}</div>
    <div class="card" style="margin:0"><h3>По подразделениям</h3>${bars(DB.departments.map(d=>[d.name,all.filter(r=>U(r.authorId).dept===d.id).length]).filter(x=>x[1]))}</div>
    <div class="card" style="margin:0"><h3>Поступление заявок за 14 дней</h3><div class="cols">${perDay.map((v,i)=>`<div class="col" title="${fmtD(days[i])}: ${v}">${v||''}<div class="f ${i===13?'today':''}" style="height:${v/maxD*100}%"></div></div>`).join('')}</div><div class="col-lbls">${days.map(d=>`<span>${d.getDate()}</span>`).join('')}</div></div>
  </div>
  <div class="card" style="margin-top:16px"><h3>Загрузка и эффективность исполнителей</h3>
    ${execs.length?`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Исполнитель</th><th>Заявок</th><th>Выполнено</th><th>Среднее время</th><th>Нарушений SLA</th><th>Средняя оценка</th></tr></thead><tbody>
    ${execs.sort((a,b)=>b.n-a.n).map(e=>`<tr><td>${esc(e.u.name)}</td><td>${e.n}</td><td>${e.fin}</td><td>${e.fin?hrs(e.avg):'—'}</td><td>${e.over?`<span class="badge b-err">${e.over}</span>`:'0'}</td><td>${e.rating?e.rating.toFixed(1)+' ★':'—'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Нет данных</div>'}
    <p class="small muted" style="margin-bottom:0">Средняя оценка по всем закрытым заявкам: ${rated.length?avg(rated,r=>r.rating).toFixed(1)+' из 5':'—'}</p></div>`;
}

function modal(title, body, onOk, okLabel='Подтвердить', cls='btn-primary'){
  $('#modal-root').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><form class="modal" id="mform" novalidate role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${body}<div class="merr" id="merr" role="alert"></div>
  <div class="modal-actions"><button type="button" class="btn" onclick="closeModal()">Отмена</button><button class="btn ${cls}">${okLabel}</button></div></form></div>`;
  const f=$('#mform');
  f.onsubmit = e => { e.preventDefault(); const fd={}; new FormData(f).forEach((v,k)=>fd[k]=v); const err=onOk(fd,f); if(err){ $('#merr').textContent=err; return; } closeModal(); save(); render(); };
  const first=f.querySelector('input:not([type=hidden]),textarea,select'); if(first) first.focus();
}
function closeModal(){ $('#modal-root').innerHTML=''; }

/* ================== Действия ================== */
const A = {
  login(e){
    e.preventDefault(); const f=e.target, login=f.login.value.trim().toLowerCase(), pw=f.pw.value, err=$('#loginErr');
    const u = DB.users.find(x=>x.login.toLowerCase()===login || x.email.toLowerCase()===login);
    if(!u){ err.textContent='Неверный логин или пароль'; audit('Неудачная попытка входа','Session',login||'—','Пользователь не найден',null); save(); return false; }
    if(!u.active){ err.textContent='Учётная запись заблокирована администратором'; return false; }
    if(u.lockedUntil>now()){ err.textContent=`Учётная запись временно заблокирована до ${new Date(u.lockedUntil).toTimeString().slice(0,5)} после 5 неудачных попыток`; return false; }
    if(pw!==u.password){
      u.failed++; audit('Неудачная попытка входа','Session',u.login,`Попытка ${u.failed} из 5`,u.id);
      if(u.failed>=5){ u.lockedUntil=now()+15*60000; u.failed=0; audit('Блокировка учётной записи на 15 минут','User',u.login,'5 неудачных попыток входа',u.id); err.textContent='Учётная запись заблокирована на 15 минут после 5 неудачных попыток'; }
      else err.textContent=`Неверный логин или пароль. Осталось попыток: ${5-u.failed}`;

  saveForm(e,typeId,editId){
    e.preventDefault();
    const t=T(typeId), f=e.target, mode=(e.submitter&&e.submitter.value)||'send', u=me();
    const old = editId?R(editId):null; const vals={}, errors={};
    t.fields.forEach(fd=>{
      let v;
      if(fd.type==='daterange'){ v={from:f[fd.key+'_from'].value,to:f[fd.key+'_to'].value}; if(!v.from&&!v.to) v=null; else if(!v.from||!v.to) errors[fd.key]='Укажите обе даты'; else if(v.to<v.from) errors[fd.key]='Дата окончания раньше даты начала'; }
      else if(fd.type==='checkbox') v=f[fd.key].checked;
      else if(fd.type==='file'){ const files=[...f[fd.key].files]; const prev=old?.form[fd.key]||[];
        const bad=files.find(x=>!FILE_EXT.includes(x.name.split('.').pop().toLowerCase())); const big=files.find(x=>x.size>DB.settings.maxMb*1048576);
        if(bad) errors[fd.key]=`Недопустимый формат: ${bad.name}`; else if(big) errors[fd.key]=`Файл больше ${DB.settings.maxMb} МБ: ${big.name}`; else if(prev.length+files.length>DB.settings.maxFiles) errors[fd.key]=`Не более ${DB.settings.maxFiles} файлов`;
        v=prev.concat(files.map(x=>({name:x.name,size:x.size}))); }
      else if(fd.type==='number'){ v=f[fd.key].value===''?'':Number(f[fd.key].value); if(v!==''&&v<0) errors[fd.key]='Значение не может быть отрицательным'; }
      else v=f[fd.key].value.trim();
      if(mode==='send' && fd.req && !errors[fd.key] && (v==null||v===''||(Array.isArray(v)&&!v.length))) errors[fd.key]='Обязательное поле';
      vals[fd.key]=v;
    });
    if(mode==='send' && t.vacation==='paid' && vals.period && !errors.period){ const n=vacDays(vals.period.from,vals.period.to); if(n>vacLeft(u)) errors.period=`Запрошено ${n} дн., доступно ${vacLeft(u)}`; if(vals.period.from<isoDate(new Date())) errors.period='Отпуск не может начинаться в прошлом'; }
    if(mode==='send' && t.id==='aho_room' && vals.timeFrom && vals.timeTo && vals.timeTo<=vals.timeFrom) errors.timeTo='Время окончания должно быть позже начала';
    if(Object.keys(errors).length){ $('#content').innerHTML=formPage(t, old?Object.assign({},old,{form:vals}):{form:vals,status:'draft',authorId:u.id,number:'',comments:[],id:''}, errors); if(!old) $('#content').querySelector('.page-h .mono')?.remove(); A.formCalc(); $('.has-err input,.has-err select,.has-err textarea')?.focus(); toast('Проверьте заполнение формы',true); return false; }
    let r = old;
    if(!r){ DB.seq[t.cat]=(DB.seq[t.cat]||0)+1; r={id:uid(),number:`${t.cat}-${new Date().getFullYear()}-${String(DB.seq[t.cat]).padStart(5,'0')}`,typeId,authorId:u.id,approverId:null,assigneeId:null,status:'draft',priority:'Средний',form:{},createdAt:now(),updatedAt:now(),history:[],comments:[],attachments:[]}; DB.requests.push(r); hist(r,'Создан черновик'); }
    else hist(r, r.status==='returned'?'Заявка исправлена заявителем':'Черновик изменён');
    r.form=vals; if(t.fields.some(x=>x.key==='priority') && vals.priority) r.priority=vals.priority;
    if(mode==='send'){ submitRequest(r); audit('Отправка заявки','Request',r.number,t.name); toast(`Заявка ${r.number} отправлена`); }
    else toast('Черновик сохранён');
    save(); go('req/'+r.id); return false;
  },

        if(!name||!login||!email){ errs.push(`стр. ${i+1}: не хватает полей`); return; }
        if(DB.users.some(x=>x.login===login||x.email===email)){ errs.push(`стр. ${i+1}: ${login} уже существует`); return; }
        const d=D(dept)?dept:'prod'; DB.users.push({id:'u'+uid(),name,login,email,position:position||'',dept:d,managerId:D(d).head,roles:['employee'],mgrCats:[],senior:false,phone:'',active:true,password:DEMO_PASSWORD,failed:0,lockedUntil:0,favorites:[],vacTotal:24,vacUsed:0,deputy:null,notif:{}}); ok++; });
      if(!ok && errs.length) return errs.join('; ');
      audit('Импорт пользователей','User','—',`${ok} записей`); toast(`Импортировано: ${ok}${errs.length?`, пропущено: ${errs.length}`:''}`);
    },'Импортировать');
  },
  toggleBlock(id){ const u=U(id); if(u.id===me().id){ toast('Нельзя заблокировать себя',true); return; } u.active=!u.active; if(u.active){u.lockedUntil=0;u.failed=0;} audit(u.active?'Разблокировка пользователя':'Блокировка пользователя','User',u.login); save(); render(); },
  resetPw(id){ const u=U(id); u.password=DEMO_PASSWORD; u.failed=0; u.lockedUntil=0; audit('Сброс пароля','User',u.login); save(); render(); toast(`Ссылка для установки пароля отправлена на ${u.email} (демо: пароль сброшен на ${DEMO_PASSWORD})`); },
  setVac(id,v){ const u=U(id); const left=Math.max(0,Number(v)||0); u.vacTotal=u.vacUsed+left; audit('Изменение баланса отпуска','VacationBalance',u.login,`Остаток: ${left}`); save(); toast('Баланс отпуска обновлён'); },
  addDept(){ modal('Новое подразделение', `<div class="field"><label for="dn">Название <span class="req">*</span></label><input id="dn" name="name"></div><div class="field"><label for="dpar">Вышестоящее</label><select id="dpar" name="parent">${DB.departments.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></div><div class="field"><label for="dh">Руководитель</label><select id="dh" name="head">${DB.users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></div>`, fd=>{ if(!fd.name.trim()) return 'Укажите название'; DB.departments.push({id:'d'+uid(),name:fd.name.trim(),parent:fd.parent,head:fd.head}); audit('Создание подразделения','Department',fd.name.trim()); },'Создать'); },
  typeSet(id,k,v){ const t=T(id); audit('Изменение типа заявки','RequestType',t.name,`${k}: ${t[k]} → ${v}`); t[k]=v; save(); if(k==='active') render(); toast('Сохранено'); },
  builderSync(f){ const b=UI.builder; b.name=f.name.value; b.cat=f.cat.value; b.sla=Number(f.sla.value)||1; b.approval=f.approval.checked;
    b.fields.forEach((x,i)=>{ const prevType=x.type; x.label=f['fl'+i].value; x.type=f['ft'+i].value; x.options=f['fo'+i].value; x.req=f['fr'+i].checked; if(prevType!==x.type) f['fo'+i].disabled = x.type!=='select'; }); },
  saveType(e){
    e.preventDefault(); A.builderSync(e.target); const b=UI.builder, err=$('#berr');
    if(!b.name.trim()){ err.textContent='Укажите название типа'; return false; }
    if(!b.fields.length || b.fields.some(f=>!f.label.trim())){ err.textContent='Добавьте поля и заполните их подписи'; return false; }
    if(b.fields.some(f=>f.type==='select' && f.options.split(';').filter(s=>s.trim()).length<2)){ err.textContent='Для выпадающего списка укажите минимум 2 варианта через «;»'; return false; }
    const t={id:'t_'+uid(),cat:b.cat,name:b.name.trim(),approval:b.approval,sla:b.sla,slaApproval:8,active:true,fields:b.fields.map((f,i)=>({key:'f'+i,label:f.label.trim(),type:f.type,req:f.req,options:f.type==='select'?f.options.split(';').map(s=>s.trim()).filter(Boolean):undefined}))};
    DB.types.push(t); audit('Создание типа заявки','RequestType',t.name,`${t.fields.length} полей, категория ${t.cat}`); UI.builder=null; UI.adminTab='catalog'; save();
    toast('Тип заявки опубликован и доступен в каталоге'); go('admin'); return false;
  },
  saveSettings(e){ e.preventDefault(); const f=e.target; DB.company=f.company.value.trim()||DB.company; DB.settings.idle=Math.max(5,Number(f.idle.value)||30); DB.settings.maxFiles=Math.max(1,Number(f.maxFiles.value)||10); DB.settings.maxMb=Math.max(1,Number(f.maxMb.value)||20); audit('Изменение системных настроек','Settings','—'); save(); render(); toast('Настройки сохранены'); return false; },
  saveDeputy(e){ e.preventDefault(); const f=e.target, u=me();
    if(f.id.value && (!f.from.value||!f.to.value||f.to.value<f.from.value)){ toast('Укажите корректный период',true); return false; }
    u.deputy = f.id.value?{id:f.id.value,from:f.from.value,to:f.to.value}:null; audit('Назначение заместителя','Deputy',u.login,u.deputy?`${shortName(U(u.deputy.id))}, ${fmtD(u.deputy.from)}–${fmtD(u.deputy.to)}`:'снят'); save(); toast('Заместитель сохранён'); return false; },
  changePw(e){ e.preventDefault(); const f=e.target, u=me(), err=$('#pwErr');
    if(f.old.value!==u.password){ err.textContent='Текущий пароль указан неверно'; return false; }
    const p=f.nw.value; if(p.length<10||!/[A-ZА-Я]/.test(p)||!/[a-zа-я]/.test(p)||!/\d/.test(p)){ err.textContent='Пароль не соответствует политике: 10+ символов, заглавные и строчные буквы, цифры'; return false; }
    if(p===u.password){ err.textContent='Новый пароль совпадает с текущим'; return false; }
    if(p!==f.nw2.value){ err.textContent='Пароли не совпадают'; return false; }
    u.password=p; audit('Смена пароля','User',u.login); save(); f.reset(); err.textContent=''; toast('Пароль изменён'); return false; },
  saveNotif(f){ const u=me(); [...f.elements].filter(x=>x.name).forEach(x=>u.notif[x.name]=x.checked); save(); toast('Настройки уведомлений сохранены'); }
};
window.go=go; window.A=A; window.UI=UI; window.closeModal=closeModal;
render();
</script>
